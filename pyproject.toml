[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-streaming-etl"
version = "0.1.0"
description = "Spotify metadata ETL starter for a BSc thesis"
requires-python = ">=3.10"
dependencies = [
  "google-cloud-bigquery>=3.20,<4",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
